[package]
name = "fs-maps-core"
description = "FreeSynergy maps core: on-demand PMTiles tile sources, size-limited cache, offline regions, places"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pmtiles = { version = "0.27", features = ["http-async", "reqwest-rustls", "write", "file-async-tokio"] }
tokio = { version = "1", features = ["rt", "macros", "fs", "sync"] }
async-trait = "0.1"
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# The contract and the provider rule (ADR 0045).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.22.0" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
proptest = "1"
