[package]
name = "fs-maps-server"
description = "Cap'n Proto server of FreeSynergy maps: the contract places.capnp over a Unix socket, in front of any Places provider and TileSource"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_maps_server"

[[bin]]
name = "fs-maps-server"
path = "src/main.rs"

[dependencies]
fs-maps-core = { path = "../fs-maps-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.32.0", features = ["rpc"] }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
