[package]
name = "fs-maps-app"
description = "The maps program of FreeSynergy, window: the shell (ADR 0065), the component Karte and the generated Admin frontend over the Cap'n Proto socket. Data and wiring only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-maps-core = { path = "../fs-maps-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.8", features = ["rpc"] }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.2" }
# One revision of fs-components for all of them (the shell types must be the same crate): the commit 31a6dc0 is
# 4688cee (fs-admin-frontend as asked) plus the new crate fs-components-map. No tag yet (reported).
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "31a6dc0d6c5c0ac1a9b4a8a76624e5ff7ce68ca3" }
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "31a6dc0d6c5c0ac1a9b4a8a76624e5ff7ce68ca3" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "31a6dc0d6c5c0ac1a9b4a8a76624e5ff7ce68ca3" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "31a6dc0d6c5c0ac1a9b4a8a76624e5ff7ce68ca3" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", rev = "31a6dc0d6c5c0ac1a9b4a8a76624e5ff7ce68ca3" }
fs-components-map = { git = "https://github.com/FreeSynergy/fs-components", rev = "31a6dc0d6c5c0ac1a9b4a8a76624e5ff7ce68ca3" }
capnp = "0.27"
uuid = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
fs-maps-server = { path = "../fs-maps-server" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
